name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm typecheck
      # tsdown 0.22.x (our pinned build tool) declares
      # `engines.node: "^22.18.0 || >=24.11.0"` -- it needs a modern Node to
      # run itself (it uses `Promise.withResolvers`, unavailable before
      # Node 22), regardless of the `--target` it builds *for*. That's a
      # build-toolchain constraint, not a constraint on the published
      # output: nothing we ship uses `Promise.withResolvers`, and the
      # package's own `engines.node: ">=20"` describes consumers of the
      # built dist, not people running `tsdown` locally. So the build step
      # only runs on Node versions tsdown itself supports; lint, format,
      # typecheck, and the full coverage-gated test suite still run
      # unconditionally on every matrix leg, including Node 20.
      - if: matrix.node-version != 20
        run: pnpm build
      - run: pnpm test:coverage

  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # license-wizard requires Node.js >= 22.13.0; kept as its own job
      # (rather than gated inside the test matrix) since it's a single
      # global check, not something that varies per Node version, and the
      # matrix's node 20 leg doesn't meet the requirement.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check the license is in sync
        run: npx license-wizard --verify --strict

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1

      # Docs generation is a single global check, not something that
      # varies per Node version, so it gets its own job rather than
      # running once per matrix leg.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Check generated docs are in sync
        run: pnpm docs:check
