name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, latest]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.16.1

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:coverage

  e2e:
    # Consumer-fidelity suite: packs the tarball, installs it into a
    # throwaway project, and drives the real ESLint CLI as a subprocess --
    # exercises actual OS process/file/git behavior, so it runs on both
    # platforms real consumers use rather than just Linux like the rest of
    # this workflow.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.16.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e

  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.16.1

      # license-wizard requires Node.js >= 22.13.0; kept as its own job
      # (rather than gated inside the test matrix) since it's a single
      # global check, not something that varies per Node version. Runs on
      # Node 24 independent of the test matrix's own Node versions.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Check the license is in sync
        run: pnpm license:verify

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.16.1

      # Docs generation is a single global check, not something that
      # varies per Node version, so it gets its own job rather than
      # running once per matrix leg.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Check generated docs are in sync
        run: pnpm docs:check
